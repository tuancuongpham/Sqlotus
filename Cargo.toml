[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.2.8"
edition = "2024"
license = "MIT"
authors = ["Tuan Cuong Pham"]
repository = "https://github.com/tuancuongpham/Sqlotus"
homepage = "https://github.com/tuancuongpham/Sqlotus"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind (not abort) so commands can turn a bug into an error instead of a crash
panic = "unwind"
strip = true
