[package]
name = "sqlotus"
version = "0.2.10"
description = "SQL editor with completion, formatting, object search and query history"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sqlotus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlotus-core = { path = "../crates/sqlotus-core" }
sqlotus-db = { path = "../crates/sqlotus-db" }
sqlotus-store = { path = "../crates/sqlotus-store" }
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-dialog = "2"
rust_xlsxwriter = "0.100.0"


